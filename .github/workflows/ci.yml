name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Banco real para os testes de integração (npm run test:integration)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conectfome
          POSTGRES_PASSWORD: conectfome
          POSTGRES_DB: conectfome_itest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conectfome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Auditoria de dependências (falha em vulnerabilidades altas/críticas)
        run: npm audit --audit-level=high

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Testes unitários
        run: npm run test

      - name: Migrar o banco de integração
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://conectfome:conectfome@localhost:5432/conectfome_itest

      - name: Testes de integração (PostgreSQL real)
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://conectfome:conectfome@localhost:5432/conectfome_itest

      - name: Build (typecheck)
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Auditoria de dependências (falha em vulnerabilidades altas/críticas)
        run: npm audit --audit-level=high

      - name: Testes
        run: npm run test

      - name: Build (typecheck + vite build)
        run: npm run build
